  <!-- artemis: the settings picture for layouts/artemis.json (1440x900 at zoom 1 -> 320x200) -->
  <defs>
    <!-- the sky: near-black overhead, warming down to the corona on the bottom edge -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060b"/>
      <stop offset="0.5" stop-color="#0a0b0d"/>
      <stop offset="0.78" stop-color="#1b1815"/>
      <stop offset="1" stop-color="#2b2620"/>
    </linearGradient>
    <!-- the limb: one mass, lit at the top, dissolving into the rail's black at both ends -->
    <linearGradient id="limb" x1="0" y1="8.4" x2="0" y2="97.3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9bdae" stop-opacity="0"/>
      <stop offset="0.13" stop-color="#c9bdae"/>
      <stop offset="0.34" stop-color="#a89c8e"/>
      <stop offset="0.62" stop-color="#877e71"/>
      <stop offset="0.79" stop-color="#7a7164"/>
      <stop offset="1" stop-color="#6f6659" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="limbDark" x1="0" y1="8.4" x2="0" y2="97.3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0c10" stop-opacity="0"/>
